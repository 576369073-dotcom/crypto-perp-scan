name: test-push

# 临时文件：仅用于验证云端能否推送到企业微信，验证完即删除
on:
  workflow_dispatch: {}

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: send test message
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          resp=$(curl -sS -m 20 -X POST -H 'Content-Type: application/json' \
            -d '{"msgtype":"markdown","markdown":{"content":"**云端部署已接通**\n> 本消息来自 GitHub Actions 定时任务，之后仅在 S/A 级信号出现时推送。"}}' \
            "$WECOM_WEBHOOK")
          echo "resp=$resp"
          echo "$resp" | grep -q '"errcode":0' || { echo "::error::推送失败"; exit 1; }
